name: System Audit E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Teste completo da Calculadora
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Iniciar versão do PR
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/taverna-http.log 2>&1 &
          echo $! > /tmp/taverna-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/taverna-http.log
          exit 1

      - name: Rodar auditoria E2E da versão do PR
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/system-audit.mjs
